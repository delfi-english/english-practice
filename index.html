<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get By · Inglés para defenderte</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="assets/js/gb.js" data-bar="off"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #eef2ff;
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR CONTRAÍBLE */
        .sidebar {
            width: 70px;
            background-color: var(--white);
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 50;
            transition: width 0.3s ease;
            overflow-x: hidden;
            white-space: nowrap;
        }

        .sidebar:hover, .sidebar.pinned {
            width: 280px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background-color: var(--primary);
            color: var(--white);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--white);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar:hover .sidebar-brand, .sidebar.pinned .sidebar-brand {
            opacity: 1;
        }

        .sidebar-brand h2 { margin: 0; font-size: 1.2rem; font-weight: 800; }

        .pin-btn {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
        }
        .pin-btn:hover { opacity: 1; transform: scale(1.1); }
        .sidebar.pinned .pin-btn { opacity: 1; transform: rotate(45deg); color: #fcd34d; }

        .sidebar-nav { padding: 15px 0; overflow-y: auto; height: calc(100vh - 70px); }
        
        .nav-category {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-light); font-weight: 800; margin: 20px 20px 10px;
            opacity: 0; transition: opacity 0.2s;
        }

        .sidebar:hover .nav-category, .sidebar.pinned .nav-category {
            opacity: 1;
        }

        .nav-item {
            display: flex; align-items: center; padding: 12px 25px;
            color: var(--text-dark); text-decoration: none; font-weight: 600;
            font-size: 0.95rem; transition: all 0.2s;
        }
        .nav-item:hover { background-color: #f5f3ff; color: var(--primary); }
        
        .nav-icon { margin-right: 20px; font-size: 1.3rem; min-width: 25px; text-align: center; }
        .nav-text { opacity: 0; transition: opacity 0.2s; }
        
        .sidebar:hover .nav-text, .sidebar.pinned .nav-text {
            opacity: 1;
        }

        .btn-back { 
            margin: 20px; background: var(--primary-dark); color: white; 
            border-radius: 8px;
        }
        .btn-back:hover { background: #111827; color: white; }

        /* MAIN CONTENT (Game Arcade) */
        .main-content {
            flex-grow: 1;
            padding: 40px;
            margin-left: 70px;
            transition: margin-left 0.3s ease;
            overflow-y: auto;
        }

        .sidebar.pinned ~ .main-content {
            margin-left: 280px;
        }

        .header-title {
            margin-top: 0;
            font-size: 2.5rem;
            color: var(--text-dark);
            font-weight: 800;
            margin-bottom: 5px;
        }

        .header-subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* GAMES GRID */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-hero {
            font-size: 4rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* Colores de las tarjetas */
        .bg-dark { background-color: #1f2937; }
        .bg-warning { background-color: #f59e0b; }
        .bg-success { background-color: #10b981; }
        .bg-danger { background-color: #e11d48; }
        .bg-info { background-color: #0ea5e9; }
        .bg-purple { background-color: #8b5cf6; }
        .bg-pink { background-color: #ec4899; }
        .bg-teal { background-color: #14b8a6; }
        .bg-indigo { background-color: #4f46e5; }
        .bg-orange { background-color: #ea580c; }
        .bg-lime { background-color: #84cc16; }
        .bg-rose { background-color: #f43f5e; }

        .card-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            color: var(--text-dark);
        }

        .game-desc {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background-color: #e0e7ff;
            color: var(--primary-dark);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn-play {
            display: block;
            text-align: center;
            background-color: #111827;
            color: var(--white);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-play:hover {
            background-color: var(--success);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: column; transition: none; }
            .sidebar:hover, .sidebar.pinned { width: 100%; }
            .pin-btn { display: none; }
            .sidebar-brand { opacity: 1; }
            .sidebar-nav { display: flex; overflow-x: auto; padding: 10px; height: auto; }
            .nav-category { display: none; }
            .nav-item { padding: 8px 15px; background: var(--secondary); margin-right: 10px; border-radius: 20px; font-size: 0.85rem; }
            .nav-text { opacity: 1; }
            .btn-back { display: none; }
            .main-content, .sidebar.pinned ~ .main-content { margin-left: 0; padding: 20px; }
            .header-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR ÍNDICE -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-brand">
                <h2>Get By</h2>
            </a>
            <button class="pin-btn" id="pin-btn" onclick="togglePin()" title="Fijar menú">📌</button>
        </div>
        
        <div class="sidebar-nav" id="nav-teoria-inicio"></div>
    </div>

    <!-- MAIN CONTENT: GAME ARCADE -->
    <div class="main-content">
        <div id="cabecera-inicio">
        <h1 class="header-title">Tu ruta de aprendizaje 🎯</h1>
        <p class="header-subtitle">Elegí una misión y practicá inglés para defenderte en el día a día.</p>
        <p id="gb-resumen"></p>
        <button id="gb-instalar" hidden>📲 Instalar app</button>

        <p class="ruta-ayuda">Seguí los módulos en orden, o elegí el tema que necesites. Cada módulo tiene su teoría y sus juegos.</p>
        </div>
        <div id="ruta"></div>
        </div>
    </div>

    <script>
        // Lógica para fijar/desfijar la barra lateral con el botón (pin)
        const sidebar = document.getElementById('sidebar');
        let isPinned = false;

        function togglePin() {
            isPinned = !isPinned;
            if (isPinned) {
                sidebar.classList.add('pinned');
            } else {
                sidebar.classList.remove('pinned');
            }
        }
    </script>
    <script src="assets/js/curso.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/inicio.js"></script>
</body>
</html>
